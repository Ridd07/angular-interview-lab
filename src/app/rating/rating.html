<h2>Rating</h2>

<div class="rating">
  @for (star of stars; track star) {
    <button mat-icon-button
      [class]="getStarClass(star)"
      (click)="selectRating(star)"
      (mouseenter)="onHover(star)"
      (mouseleave)="onLeave()">
      {{ getStar(star) }}
    </button>
  }
</div>

<p>Selected rating: {{ rating }}</p>
