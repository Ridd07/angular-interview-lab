<mat-card>

  <mat-card-header>
    <mat-card-title>Task Board</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <mat-form-field appearance="outline">

      <mat-label>Search tasks</mat-label>

      <input
        matInput
        [(ngModel)]="searchText">

    </mat-form-field>


<div class="filters">
  <button mat-button (click)="changeFilter('all')">All</button>

  <button mat-button (click)="changeFilter('todo')">Todo</button>

  <button mat-button (click)="changeFilter('in-progress')">In Progress</button>

  <button mat-button (click)="changeFilter('done')">Done</button>
</div>

@if (loading) {

  <p>Loading tasks...</p>

} @else {

  @if (filteredTasks.length === 0) {

    <p>No tasks found.</p>

  } @else {

    @for (task of filteredTasks; track task.id) {

      <mat-card class="task-row">

        <mat-card-content>

          <span>{{ task.title }}</span>

          <span>{{ task.status }}</span>

        </mat-card-content>

      </mat-card>
    }
  }
}
<p>Total tasks: {{ filteredTasks.length }}</p>
</mat-card-content>

</mat-card>
